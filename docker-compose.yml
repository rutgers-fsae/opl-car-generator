services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uv", "run", "--project", "backend", "--no-sync", "python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--no-proxy-headers"]
    environment:
      COOKIE_SECURE: "false"
    volumes:
      - ./backend/app:/app/backend/app
      - ./olveh_gen.py:/app/olveh_gen.py:ro
      - car-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    environment:
      API_PROXY: http://backend:8000
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  car-data:
